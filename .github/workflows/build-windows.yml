name: Build JARVIS for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jarvis/**'
      - 'native/**'
      - 'requirements*.txt'
      - 'build.bat'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust native core
        run: cargo build --release --manifest-path native/Cargo.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-voice.txt pyinstaller
      - name: Check Python syntax
        run: python -m compileall -q jarvis
      - name: Build single-file Windows executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name JARVIS --paths . --collect-all PySide6 --collect-all pyttsx3 --collect-all speech_recognition --collect-all pyaudio --add-binary "native/target/release/jarvis-core.exe;." jarvis/__main__.py
      - name: Publish direct EXE release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JARVIS latest
          body: |
            Latest standalone Windows x64 build of JARVIS.
            Download JARVIS.exe directly. No ZIP and no API key required.
          files: dist/JARVIS.exe
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
