name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'jarvis/**'
      - 'requirements*.txt'
      - 'build.bat'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build single-file Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name JARVIS --paths . --collect-all PySide6 --collect-all pyttsx3 jarvis/__main__.py
      - name: Upload single EXE
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows-x64-EXE
          path: dist/JARVIS.exe
          if-no-files-found: error
